name: REA
options:
  bundleIdPrefix: com.netmaru.rea
  deploymentTarget: { iOS: "16.0" }
packages:
  SeamtypeCore: { path: ../Packages/SeamtypeCore }
settings:
  base:
    SWIFT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5V9JS5722P
targets:
  REA:
    type: application
    platform: iOS
    sources: [App, Shared]
    entitlements:
      path: App/REA.entitlements
      properties: { com.apple.security.application-groups: [group.com.netmaru.rea] }
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.netmaru.rea, ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon } }
    dependencies:
      - target: REAKeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: KoEnJa
        UILaunchScreen: {}
  REAKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    entitlements:
      path: Keyboard/REAKeyboard.entitlements
      properties: { com.apple.security.application-groups: [group.com.netmaru.rea] }
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.netmaru.rea.keyboard } }
    postBuildScripts:
      # Models SeamtypeCore reads from Bundle.main.resourceURL (Resources.swift).
      - name: Copy language models
        script: |
          out="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$SRCROOT"/../Packages/SeamtypeCore/Sources/SeamtypeCore/Data/*.txt "$out/"
          # AzooKey's kanji dictionary (Apache-2.0), found by Resources.japaneseDictionary
          rm -rf "$out/Dictionary"
          cp -R "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/AzooKeyKanaKanjiConverter/Sources/KanaKanjiConverterModuleWithDefaultDictionary/azooKey_dictionary_storage/Dictionary" "$out/"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: SeamtypeCore
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: KoEnJa
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: ko-KR
            RequestsOpenAccess: true
  REAKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    settings: { base: { GENERATE_INFOPLIST_FILE: YES } }
    sources:
      - Tests
      - Keyboard/ProxyClient.swift
      - Keyboard/Suggestions.swift
      - UITests/Corpus.swift
      - Keyboard/KeyboardViewController.swift
      - Shared
    dependencies:
      - package: SeamtypeCore
  REAUITests:
    type: bundle.ui-testing
    platform: iOS
    settings: { base: { GENERATE_INFOPLIST_FILE: YES } }
    sources: [UITests]
    dependencies:
      - target: REA
schemes:
  REA:
    build: { targets: { REA: all } }
    test: { targets: [REAKeyboardTests, REAUITests] }
